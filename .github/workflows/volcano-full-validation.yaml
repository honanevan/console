name: Validate submitted Volcano contribution

on:
  push:
    branches: [codex/volcano-full-validation]

permissions:
  contents: read

jobs:
  full-console:
    if: github.repository == 'honanevan/console'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: bd84c913e0cc8f56ccee0dfc543258b3de63a747
          fetch-depth: 0
          persist-credentials: false
      - name: Verify submitted revision
        run: test "$(git rev-parse HEAD)" = bd84c913e0cc8f56ccee0dfc543258b3de63a747
      - name: Add repository MCP test service
        run: |
          cat > /tmp/volcano-mcp-compose.yml <<'YAML'
          services:
            mcp:
              image: tzolov/mcp-everything-server:v3
              network_mode: service:console
              command: [node, dist/index.js, streamableHttp]
          YAML
          docker compose -f docker-compose.test.yml -f /tmp/volcano-mcp-compose.yml config > /tmp/volcano-compose.yml
          cp /tmp/volcano-compose.yml docker-compose.test.yml
      - name: Run full test target
        env:
          CONSOLE_CMD: '"git config --global --add safe.directory /app && mix deps.get && mix compile && mix test && echo VOLCANO_FULL_TEST_COMPLETED"'
        run: |
          set -o pipefail
          mkdir -p secrets
          make test-full 2>&1 | tee /tmp/volcano-full-test.log
          grep -E 'console-1[[:space:]]*\|[[:space:]]*VOLCANO_FULL_TEST_COMPLETED' /tmp/volcano-full-test.log
          grep -E '[1-9][0-9]* tests?, 0 failures' /tmp/volcano-full-test.log
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down
